<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedFind — Medicine Availability Finder</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>💊 MedFind</h1>
        <p class="tagline">Find medicines at pharmacies near you</p>
    </header>

    <main>
        <section class="search-box">
            <input type="text" id="search-input" placeholder="Search medicine (e.g. Paracetamol, Azithromycin)">
            <button id="search-btn">Search</button>
        </section>

        <div id="results"></div>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
